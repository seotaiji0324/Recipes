<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>영양 가득한 레시피 — 매일의 건강한 한 끼</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="hero">
        <a class="badge" href="#discover">
          영양 레시피를 새로 추가했어요
          <span aria-hidden="true">→</span>
        </a>

        <h1>
          ***모든 식사를 위한<br />
          맛있고 건강한 레시피
        </h1>

        <p class="lede">
          건강을 챙기고 운동 목표를 도우며, 영양 있는 식사를 즐겁게 만드는
          다양한 레시피를 만나보세요.
        </p>

        <div class="cta-row">
          <a class="btn btn-primary" href="#gallery">영감 얻기</a>
          <a class="btn btn-secondary" href="#discover">더 알아보기</a>
        </div>

        <ul class="trust">
          <li class="trust-people">
            <span class="avatars">
              <img src="images/a1.jpg" alt="" />
              <img src="images/a2.jpg" alt="" />
              <img src="images/a3.jpg" alt="" />
            </span>
            미식가들이 신뢰해요
          </li>
          <li>
            <span class="check" aria-hidden="true">✓</span>
            광고 없음
          </li>
          <li>
            <span class="check" aria-hidden="true">✓</span>
            다양한 건강 레시피
          </li>
        </ul>
      </section>

      <section class="gallery" id="gallery" aria-label="추천 레시피 사진">
        <div class="gallery-track">
          <figure>
            <a class="gallery-card" href="bowl.html" aria-label="레인보우 아보카도 파워볼 레시피 열기">
              <img
                src="images/bowl.jpg"
                alt="병아리콩, 고구마, 채소가 올라간 레인보우 아보카도볼"
              />
            </a>
          </figure>
          <figure>
            <a class="gallery-card" href="smoothie.html" aria-label="선라이즈 과일 스무디 트리오 레시피 열기">
              <img
                src="images/smoothie.jpg"
                alt="그래놀라와 신선한 토핑이 올라간 과일 스무디 세 잔"
              />
            </a>
          </figure>
          <figure>
            <a class="gallery-card" href="salmon.html" aria-label="허브 살사 연어 스테이크 레시피 열기">
              <img
                src="images/salmon.jpg"
                alt="허브 살사를 올린 연어와 그린 샐러드"
              />
            </a>
          </figure>
          <figure>
            <a class="gallery-card" href="pasta.html" aria-label="페스토 파르팔레 샐러드 레시피 열기">
              <img
                src="images/pasta.jpg"
                alt="신선한 채소와 페스토 나비 파스타"
              />
            </a>
          </figure>
        </div>
      </section>

      <section class="discover" id="discover">
        <p class="kicker">{영양 가득한 레시피 만나보기}</p>
        <h2>
          건강하고 맛있는 레시피의 세계로
          <span>웰빙을 위한 큐레이션 컬렉션으로 풍미 가득한 한 끼를 즐겨보세요.</span>
        </h2>
      </section>

      <section class="showcase" aria-label="더 많은 레시피">
        <figure>
          <a class="gallery-card" href="greens.html" aria-label="아삭한 가든 샐러드 레시피 열기">
            <img
              src="images/greens.jpg"
              alt="호두, 올리브, 채썬 당근이 들어간 가든 샐러드"
            />
          </a>
        </figure>
        <figure>
          <a class="gallery-card" href="breakfast.html" aria-label="아보카도 에그 토스트 레시피 열기">
            <img
              src="images/breakfast.jpg"
              alt="삶은 달걀을 올린 아보카도 토스트"
            />
          </a>
        </figure>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
